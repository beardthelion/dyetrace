[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dyetrace"
version = "0.1.0"
description = "Black-box dataflow tracer for authorized bug-bounty testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "mcp>=2.3,<3",
]
mcp = [
    "mcp>=2.3,<3",
]

[project.scripts]
dyetrace = "dyetrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dyetrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
